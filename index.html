<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MosqueList - Discover the World's Most Magnificent Mosques</title>
    <meta name="description" content="Explore 199+ mosques in 50+ countries. From the three holiest sites in Islam to architectural masterpieces. Map, bucket list, and fact-checked guides." />
    <meta name="author" content="ummah.build" />
    <meta name="keywords" content="mosques, Islamic travel, Hajj, Umrah, Muslim travel, prayer, Masjid al-Haram, Al-Aqsa, mosque tourism, bucket list, spiritual journey, Muslim travel guide" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#b8860b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#b8860b" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="MosqueList" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MosqueList" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:site_name" content="MosqueList" />
    <meta property="og:title" content="MosqueList - Discover the World's Most Magnificent Mosques" />
    <meta property="og:description" content="Explore 199+ mosques in 50+ countries. From the three holiest sites in Islam to architectural masterpieces. Map, bucket list, and fact-checked guides." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mosquelist.com/mosquelistmeta.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MosqueList - Discover mosques worldwide" />
    <meta property="og:url" content="https://mosquelist.com" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mosquelist" />
    <meta name="twitter:creator" content="@mosquelist" />
    <meta name="twitter:title" content="MosqueList - Discover the World's Most Magnificent Mosques" />
    <meta name="twitter:description" content="Explore 199+ mosques in 50+ countries. Map, bucket list, and fact-checked guides. Your mosque journey starts here." />
    <meta name="twitter:image" content="https://mosquelist.com/mosquelistmeta.jpeg" />
    <meta name="twitter:image:alt" content="MosqueList - Discover mosques worldwide" />

    <link rel="canonical" href="https://mosquelist.com" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="text/plain" href="https://mosquelist.com/ai.txt" title="AI indexing information" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MosqueList",
      "description": "Discover, explore, and plan your spiritual journey to the world's most magnificent mosques. 199+ mosques in 50+ countries—map, bucket list, and fact-checked guides.",
      "url": "https://mosquelist.com",
      "publisher": {
        "@type": "Organization",
        "name": "ummah.build"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://mosquelist.com/explore?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <style>
      html, body { background-color: hsl(40, 30%, 97%); }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(40 30% 97%);
        z-index: 9999;
      }
      #app-loading .loading-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
      }
      #app-loading .loading-logo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #app-loading .loading-spinner {
        position: absolute;
        inset: -6px;
        border: 3px solid hsl(35 25% 85%);
        border-top-color: hsl(38 70% 45%);
        border-radius: 50%;
        animation: app-loading-spin 0.9s linear infinite;
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="app-loading" aria-hidden="true">
      <div class="loading-logo-wrap">
        <img src="/favicon.ico" alt="" class="loading-logo" width="64" height="64" />
        <div class="loading-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
